name: Build and deploy Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and export Web
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification dependencies
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq ripgrep python3 libfontconfig1

      - name: Prepare matching export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ "$HOME/.local/share/godot/export_templates" != "/root/.local/share/godot/export_templates" ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          fi

      - name: Run verification and export Godot Web build
        shell: bash
        run: |
          timeout 180s env \
            GODOT_BIN="$(command -v godot)" \
            GODOT_TEMPLATE_DIR="$HOME/.local/share/godot/export_templates" \
            game/tests/verify.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
